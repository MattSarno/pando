[package]
name = "pando"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "time", "macros"] }
dotenvy = "0.15"
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
time = { version = "0.3", features = ["serde-human-readable"] }
rand = "0.10"
subtle = "2.6"
form_urlencoded = "1"
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
