app = "pando-server"
primary_region = "ord"

[build]

[env]
  HOST_URL = "0.0.0.0:8080"
  PUBLIC_BASE_URL = "https://pando-server.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
